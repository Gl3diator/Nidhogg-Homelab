name: obsidian-livesync

services:
  couchdb:
    image: couchdb:3.4.2
    container_name: obsidian-couchdb
    restart: unless-stopped

    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}

    volumes:
      - /srv/data/obsidian-livesync/couchdb:/opt/couchdb/data
      - ./config/livesync.ini:/opt/couchdb/etc/local.ini

    ports:
      - "127.0.0.1:5984:5984"

    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf -u "$$COUCHDB_USER:$$COUCHDB_PASSWORD" http://localhost:5984/_session | grep -q "\"ok\":true" || exit 1'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

    networks:
      - obsidian

  couchdb-init:
    image: curlimages/curl:latest
    container_name: obsidian-couchdb-init
    restart: "no"

    depends_on:
      couchdb:
        condition: service_started

    environment:
      COUCHDB_INTERNAL_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DATABASE: ${COUCHDB_DATABASE}

    volumes:
      - ./scripts/couchdb-init.sh:/couchdb-init.sh:ro

    entrypoint:
      - sh
      - /couchdb-init.sh

    networks:
      - obsidian

networks:
  obsidian:
    driver: bridge