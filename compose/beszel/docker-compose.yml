services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: "${BESZEL_APP_URL}"
    ports:
      - "${TAILSCALE_IP}:8090:8090"
    volumes:
      - /srv/data/beszel/hub:/beszel_data
      - /srv/data/beszel/socket:/beszel_socket

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: beszel-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "0"
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    depends_on:
      - socket-proxy
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: "${BESZEL_APP_URL}"
      DOCKER_HOST: tcp://127.0.0.1:2375
      KEY: "${BESZEL_AGENT_KEY}"
      TOKEN: "${BESZEL_AGENT_TOKEN}"
    volumes:
      - /srv/data/beszel/agent:/var/lib/beszel-agent
      - /srv/data/beszel/socket:/beszel_socket
